name: MELIPU

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: ["gh-pages"]
  pull_request:
    branches: ["gh-pages"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 datetime pytz flake8 pyfcm firebase-admin
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Verify flake8 installation
        run: |
          flake8 --version

      - name: Compile dependencies
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Create Firebase credentials file
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" > serviceAccountKey.json

      - name: Run app.py
        env:
          FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          python app.py

      - name: Clean up credentials
        if: always()
        run: rm -f serviceAccountKey.json

      - name: Commit and push index.html
        run: |
          git config --global user.name 'eugeniosaintemarie'
          git config --global user.email 'e.saintemarie@outlook.com'
          git add index.html
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            git commit -m "Update index.html"
            git push https://${{ secrets.SHOP_PUBLICATIONS_AUT }}@github.com/eugeniosaintemarie/melipu.git gh-pages
          fi
